schema_version = "1.4"
artifacts = ["/app/answers"]
multi_step_reward_strategy = "mean"

[task]
name = "inkling/uw-06"
description = "Apply the limit per building"

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 1024

[verifier]
timeout_sec = 180.0
environment_mode = "separate"

[verifier.env]
GRADER_URL = "${GRADER_URL}"
GRADER_MODEL = "${GRADER_MODEL}"
GRADER_API_KEY = "${GRADER_API_KEY}"

[[steps]]
name = "turn-1"

[[steps]]
name = "turn-2"

[[steps]]
name = "turn-3"
